<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect an agent — Keel</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --fg:#e6e6e6; --mut:#8b93a7; --acc:#6ea8fe; }
    body { margin:0; font:14px/1.6 system-ui, sans-serif; background:var(--bg); color:var(--fg);
           display:flex; justify-content:center; padding:40px 16px; }
    .card { background:var(--card); border:1px solid #232733; border-radius:12px;
            padding:24px; width:100%; max-width:460px; }
    h1 { font-size:18px; margin:0 0 4px; } p.mut { color:var(--mut); margin:0 0 18px; }
    label { display:block; font-size:12px; color:var(--mut); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.05em; }
    input, select { width:100%; box-sizing:border-box; background:#0b0d11; color:var(--fg);
            border:1px solid #2a2f3a; border-radius:8px; padding:10px 12px; font-size:15px; }
    input#user_code { letter-spacing:.18em; text-transform:uppercase; font-size:18px; text-align:center; }
    button { margin-top:18px; width:100%; background:var(--acc); color:#06101f; border:0;
            border-radius:8px; padding:11px; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #status { margin-top:14px; min-height:20px; color:var(--mut); }
    .ok { color:#5bd6a0; } .err { color:#f08a8a; }
    #signin { margin-bottom:8px; }
    details { margin-top:16px; } summary { color:var(--mut); cursor:pointer; font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Connect an agent to Keel</h1>
    <p class="mut">Sign in, then enter the code shown by <code>keel_connect</code>.</p>

    <div id="signin">
      <button id="google" type="button">Sign in with Google</button>
      <div class="pill mut" id="who"></div>
    </div>

    <label for="user_code">Device code</label>
    <input id="user_code" placeholder="XXXX-XXXX" autocomplete="off" />

    <label for="scope">Access</label>
    <select id="scope">
      <option value="full">Full (read &amp; write)</option>
      <option value="read_only">Read-only</option>
    </select>

    <button id="approve" disabled>Approve agent</button>
    <div id="status"></div>

    <details>
      <summary>Advanced: paste an ID token (dev / no Firebase)</summary>
      <label for="idtoken">ID token</label>
      <input id="idtoken" placeholder="Firebase/Google ID token, or fake:uid:email in dev" />
    </details>
  </main>
  <script src="/connect/connect.config.js"></script>
  <script src="/connect/connect.js"></script>
</body>
</html>
